<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جهاد النفس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: one story screen at a time — picture, then text sized to fit; fixed top bar for score, fixed bottom bar for back/next. RTL throughout.
   Colour: a calm light-green reading world. Green = the one action colour (buttons, current level, speech);
   gold = stars only; teal = word treasures only; parchment = the hadith. Correct/wrong use their own green/red tints. */
:root{
  --ground:#eaf5e4;      /* light green page background */
  --paper:#fbfef9;       /* cards and the reading sheet */
  --ink:#1c2b20;
  --muted:#56695a;
  --line:#cfe3c7;
  --plum:#25744a;        /* main green: buttons, titles, speech (token name kept from v1) */
  --plum-soft:#dcefd6;
  --plum-deep:#17502f;   /* 3D edge under map buttons */
  --lock-deep:#b5cdac;
  --amber:#9c5b00;       /* stars */
  --amber-soft:#fbefd6;
  --sky:#16708f;         /* word treasures */
  --sky-soft:#dff0f5;
  --good:#1f7a45; --good-soft:#dff3e5;
  --bad:#b3261e;  --bad-soft:#fbe6e3;
  --scroll:#f4efd8;      /* parchment for the hadith */
  --veil:rgb(16 40 24 / .45);
  --shadow:0 1px 2px rgb(30 70 40 / .08),0 8px 24px rgb(30 70 40 / .10);
  --f-display:"Aref Ruqaa","Noto Sans Arabic",serif;
  --f-quote:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-ui:"Noto Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --fs:1.18rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1a13;--paper:#17241b;--ink:#e5f0e6;--muted:#9bb3a0;--line:#2a3e2f;
  --plum:#86d6a3;--plum-soft:#1d3526;--plum-deep:#4a9467;--lock-deep:#0a120d;--amber:#f2b24c;--amber-soft:#382b12;
  --sky:#7cc8e6;--sky-soft:#13303a;--good:#84d9a1;--good-soft:#163322;--bad:#ff8f82;--bad-soft:#3b1d1a;
  --scroll:#29291b;--veil:rgb(0 0 0 / .55);--shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .35);color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f1a13;--paper:#17241b;--ink:#e5f0e6;--muted:#9bb3a0;--line:#2a3e2f;
  --plum:#86d6a3;--plum-soft:#1d3526;--plum-deep:#4a9467;--lock-deep:#0a120d;--amber:#f2b24c;--amber-soft:#382b12;
  --sky:#7cc8e6;--sky-soft:#13303a;--good:#84d9a1;--good-soft:#163322;--bad:#ff8f82;--bad-soft:#3b1d1a;
  --scroll:#29291b;--veil:rgb(0 0 0 / .55);--shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .35);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px}
.top-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track b{display:block;height:100%;width:0;background:var(--plum);border-radius:3px;transition:width .3s}
.pic.thumb img{max-height:18vh}
.where{display:block;margin-top:4px;font-weight:600}
.score{display:flex;gap:6px;font-family:var(--f-ui);font-size:.88rem;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-weight:600}
.chip.star{background:var(--amber-soft);color:var(--amber)}
.chip.gem{background:var(--sky-soft);color:var(--sky)}
.chip svg{width:15px;height:15px}
.chip.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25)}}
.tools{display:flex;gap:4px}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-width:34px;height:32px;padding:0 6px;font-family:var(--f-ui);font-size:.8rem;cursor:pointer}
.tbtn[aria-pressed="false"]{color:var(--muted)}

/* page */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
.page{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:12px;animation:enter .35s ease}
.page.back{animation-name:enterBack}
@keyframes enter{from{opacity:.4;transform:translateX(-18px)}}
@keyframes enterBack{from{opacity:.4;transform:translateX(18px)}}
.eyebrow{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.02em;color:var(--muted);display:flex;justify-content:space-between}
.pic{max-width:70%;align-self:center;margin:0;border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);border:4px solid var(--paper)}
.pic img{display:block;width:auto;height:auto;max-width:100%;max-height:28vh;border-radius:14px}  /* whole picture, scaled — never cropped */
.sheet{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px}
.story p{font-size:var(--fs);line-height:1.9;margin:0 0 .5em;text-wrap:pretty}
.story p:last-child{margin-bottom:0}
.story .say{color:var(--plum)}

/* hadith scroll */
.scroll{background:var(--scroll);border-radius:6px 22px 6px 22px;padding:22px 20px;position:relative;box-shadow:var(--shadow)}
.scroll h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0 0 10px;color:var(--plum);text-align:center}
.scroll p{font-family:var(--f-quote);font-size:calc(var(--fs) + .22rem);line-height:2.1;margin:0 0 .4em;text-align:center}
.scroll .key{color:var(--plum);font-weight:700}

/* word gems */
.w{background:none;border:0;padding:0 1px;cursor:pointer;font:inherit;color:inherit;
  border-bottom:2px dotted var(--sky);background-image:linear-gradient(var(--sky-soft),var(--sky-soft));background-size:100% 0;background-repeat:no-repeat;background-position:bottom;transition:background-size .2s}
.w:hover{background-size:100% 100%}
.w.got{border-bottom-style:solid;color:var(--sky)}

/* challenge */
.quiz{display:flex;flex-direction:column;gap:14px}
.quiz h3{margin:0;font-family:var(--f-display);font-size:1.3rem;color:var(--plum);display:flex;align-items:center;gap:8px}
.quiz h3 svg{width:24px;height:24px;flex:none}
.q{display:flex;flex-direction:column;gap:10px}
.q + .q{border-top:1px dashed var(--line);padding-top:14px}
.q .ask{font-family:var(--f-ui);font-weight:600;font-size:calc(var(--fs) * .87);line-height:1.7;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-family:var(--f-ui);font-size:calc(var(--fs) * .85);line-height:1.6;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .dot{border-color:var(--good);background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.wrong .dot{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.fb{font-family:var(--f-ui);font-size:.92rem;line-height:1.7;margin:0;padding:10px 12px;border-radius:12px}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.no{background:var(--bad-soft);color:var(--bad)}

/* cover + finish */
.cover{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:4px}
.cover .kicker{font-family:var(--f-ui);color:var(--muted);font-size:.9rem;margin:0}
.cover h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,12vw,4rem);line-height:1.2;margin:0;color:var(--plum);text-wrap:balance}
.cover .sub{font-family:var(--f-quote);font-size:1.2rem;margin:0;color:var(--ink)}
.fan{position:relative;width:min(100%,340px);height:min(210px,24dvh);margin-block:2px}
.fan img{position:absolute;height:84%;width:auto;top:10%;border-radius:12px;border:4px solid var(--paper);box-shadow:var(--shadow)}
.fan img:nth-child(1){right:0;transform:rotate(7deg)}
.fan img:nth-child(2){left:0;transform:rotate(-7deg)}
.fan img:nth-child(3){left:50%;top:0;height:96%;transform:translateX(-50%);z-index:2}
.rules{display:grid;gap:8px;width:100%;text-align:right;padding-block:12px}
.rule{display:flex;gap:12px;align-items:center;font-family:var(--f-ui);font-size:.98rem;line-height:1.6}
.rule .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.rule .ic svg{width:20px;height:20px}
.big{border:0;border-radius:16px;background:var(--plum);color:var(--paper);font-family:var(--f-ui);font-weight:600;font-size:1.1rem;padding:14px 28px;cursor:pointer;box-shadow:var(--shadow)}
.ghost{border:2px solid var(--line);border-radius:14px;background:var(--paper);font-family:var(--f-ui);font-size:.95rem;padding:10px 18px;cursor:pointer}
.badge{width:min(104px,13dvh);height:min(104px,13dvh)}
/* screens that still overflow on a very small phone or with very large text drop their decorations */
.tight .fan,.tight .badge,.tight .pic.thumb,.tight .kicker,.tight .sub{display:none}
.tight .rules .rule .ic{display:none}
.wchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wchip{font-family:var(--f-body);font-size:.95rem;padding:4px 12px;border-radius:99px;border:0;background:var(--sky-soft);color:var(--sky);cursor:pointer}
.wchip.miss{background:var(--ground);color:var(--muted);cursor:default;border:1px dashed var(--line)}
.result{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.result .chip{font-size:1.05rem;padding:8px 16px}
.wordlist{display:grid;gap:8px;text-align:right}
.wordlist div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--sky-soft)}
.wordlist b{font-family:var(--f-body);color:var(--sky);font-size:1.05rem}
.wordlist span{font-family:var(--f-ui);font-size:.92rem;line-height:1.6}
.wordlist .locked{background:var(--ground);color:var(--muted)}
.wordlist .locked b{color:var(--muted)}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nbtn{display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:11px 18px;font-family:var(--f-ui);font-weight:600;font-size:1rem;cursor:pointer;border:2px solid var(--line);background:var(--paper)}
.nbtn.next{background:var(--plum);border-color:var(--plum);color:var(--paper)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn svg{width:18px;height:18px}
.pnum{font-family:var(--f-ui);color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* word sheet */
.veil{position:fixed;inset:0;z-index:40;background:var(--veil);display:flex;align-items:flex-end;justify-content:center}
.card{background:var(--paper);width:100%;max-width:640px;border-radius:22px 22px 0 0;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:10px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.card .new{font-family:var(--f-ui);font-size:.85rem;color:var(--sky);font-weight:600}
.card h4{margin:0;font-family:var(--f-body);font-size:1.6rem;color:var(--sky)}
.card p{margin:0;font-family:var(--f-ui);font-size:1.05rem;line-height:1.8}

/* settings sheet */
.gear{width:38px;height:36px;display:grid;place-items:center;padding:0}
.gear svg{width:20px;height:20px}
.set-title{color:var(--plum)!important;font-family:var(--f-display)!important}
.sample{font-family:var(--f-body)!important;font-size:var(--fs)!important;line-height:1.9!important;background:var(--ground);border-radius:12px;padding:10px 14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line);font-family:var(--f-ui);font-size:1rem;font-weight:600}
.stepper{display:flex;align-items:center;gap:8px}
.sbtn{width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-family:var(--f-ui);font-size:1.05rem;font-weight:600;cursor:pointer}
.sbtn:disabled{opacity:.35;cursor:default}
.lvl{min-width:44px;text-align:center;font-family:var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:9px 16px;font-family:var(--f-ui);font-size:.98rem;cursor:pointer;min-width:72px}
.seg button + button{border-inline-start:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--plum);color:var(--paper);font-weight:600}
:root.arial{--f-body:Arial,"Helvetica Neue",Helvetica,sans-serif;--f-quote:Arial,"Helvetica Neue",Helvetica,sans-serif;--f-ui:Arial,"Helvetica Neue",Helvetica,sans-serif}

/* app shell: home + map hide the reading bars */
body.chromeless .top,body.chromeless .nav{display:none}
body.chromeless main{padding-block:12px calc(28px + env(safe-area-inset-bottom,0px))}
.home{max-width:520px;min-height:calc(100dvh - 60px);margin-inline:auto;display:flex;flex-direction:column;align-items:stretch;gap:8px;animation:enter .35s ease}
.homebar{display:flex;justify-content:flex-end}
.homemid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:28px}
.bookcover{margin:0;width:min(100%,440px);border-radius:16px;overflow:hidden;box-shadow:0 2px 4px rgb(30 70 40 / .12),0 18px 40px rgb(30 70 40 / .22);transform:rotate(-1.2deg)}
.bookcover img{display:block;width:100%;height:auto}
.home .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.home .meta span{font-family:var(--f-ui);font-size:.9rem;padding:5px 12px;border-radius:99px;background:var(--paper);color:var(--muted);box-shadow:var(--shadow)}

.map{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;animation:enter .35s ease}
.maphead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ground);display:flex;align-items:center;gap:8px;padding-block:6px 10px}
.maphead h1{flex:1;margin:0;font-family:var(--f-display);font-weight:700;color:var(--plum);font-size:1.7rem;line-height:1.3}
.maphead .tbtn{height:36px;padding:0 10px;display:inline-flex;align-items:center;gap:4px}
.maphead .tbtn svg{width:18px;height:18px}
.trail{position:relative;width:100%}
.trail svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;width:128px;margin-left:-64px;margin-top:-40px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.disc{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;background:var(--plum);color:var(--paper);box-shadow:0 6px 0 var(--plum-deep),0 10px 18px rgb(30 70 40 / .25);transition:transform .12s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--plum-deep)}
.node.done .disc{background:var(--amber);box-shadow:0 6px 0 color-mix(in srgb,var(--amber) 70%,black),0 10px 18px rgb(30 70 40 / .25)}
.node.locked .disc{background:var(--line);color:var(--muted);box-shadow:0 6px 0 var(--lock-deep)}
.node.locked .disc svg{width:28px;height:28px}
.node.current .disc::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--amber);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.node .name{font-family:var(--f-ui);font-weight:600;font-size:.9rem;line-height:1.5;background:var(--paper);color:var(--ink);padding:3px 12px;border-radius:99px;box-shadow:var(--shadow);white-space:nowrap}
.node.locked .name{color:var(--muted)}
.soon{font-family:var(--f-ui);font-size:.75rem;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:1px 9px;border-radius:99px}
.rate{display:flex;gap:2px;color:var(--line)}
.rate svg{width:18px;height:18px}
.rate .on{color:var(--amber)}
.goal{position:absolute;width:120px;margin-left:-60px;margin-top:-36px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-ui);font-size:.85rem;color:var(--muted)}
.goal .cup{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);border:3px dashed var(--amber)}
.goal .cup svg{width:38px;height:38px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.95rem;padding:10px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* leaf burst */
.leaf{position:fixed;width:14px;height:14px;border-radius:0 70% 0 70%;pointer-events:none;z-index:50;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.leaf{display:none}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <div class="track" id="track" aria-hidden="true"></div>
  <div class="score">
    <span class="chip star" id="stars" title="النجوم"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><b>٠</b></span>
    <span class="chip gem" id="gems" title="كنوز الكلمات"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12l4 6-10 12L2 9z"/></svg><b>٠</b></span>

/* ---- text → word tokens, so a page can be broken between sentences (or, if it must, between words) ---- */
function tokenize(html){
  const toks=[];let cls=null,sp=false,m;
  const re=/<span class="(\w+)">|<\/span>|\[\[([^|\]]+)\|(\w+)\]\]|([^<\[]+)/g;
  while((m=re.exec(html))){
    if(m[1]){cls=m[1];continue}
    if(m[0]==="</span>"){cls=null;continue}
    if(m[2]){toks.push({t:m[2],w:m[3],cls,sp});sp=false;continue}
    for(const part of m[4].split(/(\s+)/)){if(!part)continue;if(/^\s+$/.test(part)){sp=true;continue}toks.push({t:part,cls,sp});sp=false}
  }
  return toks;
}
function toHTML(toks){
  let h="",cur=null;
  toks.forEach((k,i)=>{
    const space=i>0&&k.sp?" ":"",body=k.w?`[[${k.t}|${k.w}]]`:k.t;
    if(k.cls!==cur){if(cur)h+="</span>";h+=space;if(k.cls)h+=`<span class="${k.cls}">`;cur=k.cls;h+=body}
    else h+=space+body;
  });
  if(cur)h+="</span>";
  return h;
}
function strength(t){return /[.!؟?]+["»]?$/.test(t)?2:/[،,:؛]["»]?$/.test(t)?1:0}
function breaks(tk,from,need){const out=[];for(let j=from;j<tk.length-1;j++)if(tk[j+1].sp&&strength(tk[j].t)>=need)out.push(j+1);return out}

const SCENES=RAW.map((sc,si)=>sc.type==="story"?{...sc,si,toks:(sc.hadith||sc.text).map(tokenize)}:null).filter(Boolean);

/* Picture size is worked out here (not left to the browser) so the page can be measured before the image has loaded.
   Whole picture, never cropped: at most 70% of the text width and 28% of the screen height. */
function picStyle(n,hFrac){
  const [w,h]=DIM[n],cs=getComputedStyle(main);
  const cw=Math.min(640,main.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  let iw=Math.min(cw*.7-8,w),ih=iw*h/w;
  const maxH=innerHeight*hFrac;if(ih>maxH){ih=maxH;iw=ih*w/h}
  return `width:${iw.toFixed(1)}px;height:${ih.toFixed(1)}px`;
}
function storyHTML(pg,label){
  const sc=SCENES.find(x=>x.si===pg.si),[w,h]=DIM[sc.img];
  const paras=pg.chunks.map(c=>`<p>${words(toHTML(sc.toks[c.p].slice(c.from,c.to)))}</p>`).join("");
  const body=sc.hadith
    ?`<section class="scroll">${pg.chunks[0].p===0&&pg.chunks[0].from===0?`<h2>${sc.title}</h2>`:""}${paras}</section>`
    :`<section class="sheet story">${paras}</section>`;
  return `<div class="eyebrow"><span>${label}</span><span>صفحة الكتاب ${AR(sc.book)}</span></div>
    <figure class="pic"><img src="${IMG[sc.img]}" width="${w}" height="${h}" style="${picStyle(sc.img,.28)}" alt="${sc.alt}"></figure>${body}`;
}
function overflows(){
  const a=main.firstElementChild;if(!a)return false;
  const last=a.lastElementChild;if(!last)return false;
  return last.getBoundingClientRect().bottom>$("next").closest(".nav").getBoundingClientRect().top-8;
}
/* Fill each screen with as much text as fits above the buttons, measured on the reader's own screen. */
function paginate(){
  document.body.classList.remove("chromeless");
  const y=window.scrollY;window.scrollTo(0,0);
  const out=[];
  for(const sc of SCENES){
    const tk=sc.toks;let cur=[],p=0,i=0;
    const fits=ch=>{main.innerHTML=`<article class="page">${storyHTML({si:sc.si,chunks:ch},"الصفحة")}</article>`;strip(main);return !overflows()};
    const close=()=>{out.push({type:"story",si:sc.si,img:sc.img,chunks:cur});cur=[]};
    while(p<tk.length){
      const n=tk[p].length;
      if(fits([...cur,{p,from:i,to:n}])){cur.push({p,from:i,to:n});p++;i=0;continue}
      let placed=false;
      for(const need of cur.length?[2]:[2,1,0]){
        const bs=breaks(tk[p],i,need);let lo=0,hi=bs.length-1,best=-1;
        while(lo<=hi){const mid=(lo+hi)>>1;if(fits([...cur,{p,from:i,to:bs[mid]}])){best=mid;lo=mid+1}else hi=mid-1}
        if(best>=0){cur.push({p,from:i,to:bs[best]});i=bs[best];placed=true;break}
      }
      if(placed||cur.length){close();continue}
      cur.push({p,from:i,to:i+1});i++;if(i>=n){p++;i=0}close();   // a single word taller than the screen: show it anyway
    }
    if(cur.length)close();
  }
  STORY_N=out.length;
  PAGES=[{type:"cover"},...out,{type:"challenge"},...QS,{type:"end"}];
  dirty=false;
  window.scrollTo(0,y);
}
function anchorOf(pg){return pg&&pg.type==="story"?{t:"story",si:pg.si,p:pg.chunks[0].p,from:pg.chunks[0].from}:pg?{t:pg.type,n:pg.n||0}:null}
function findAnchor(a){
  if(!a)return 0;
  if(a.t==="story"){
    const i=PAGES.findIndex(pg=>pg.type==="story"&&pg.si===a.si&&pg.chunks.some(c=>c.p===a.p&&c.from<=a.from&&(c.to>a.from||c.to===(SCENES.find(x=>x.si===a.si).toks[c.p].length))));
    return i<0?0:i;
  }
  const i=PAGES.findIndex(pg=>pg.type===a.t&&(pg.n||0)===a.n);return i<0?0:i;
}
function srcPage(x){return PAGES.findIndex(pg=>pg.type==="story"&&pg.si===x.si&&pg.chunks.some(c=>c.p===x.para&&c.from===0))}

    const p=pts[i];
    if(!l.ready)return `<button class="node locked" data-level="${l.n}" style="left:${p.x}%;top:${p.y}px" aria-label="المستوى ${AR(l.n)}، قريباً">
      <span class="disc">${LOCK}</span><span class="name">${l.title}</span><span class="soon">قريباً</span></button>`;
    const rs=[0,1,2].map(k=>`<span class="${k<r?"on":""}">${STAR}</span>`).join("");
    return `<button class="node ${done?"done":"current"}" data-level="${l.n}" style="left:${p.x}%;top:${p.y}px" aria-label="المستوى ${AR(l.n)}: ${l.title}">
      <span class="disc">${AR(l.n)}</span><span class="name">${l.title}</span><span class="rate" aria-label="${AR(r)} من ٣ نجوم">${rs}</span></button>`;
  }).join("");
  main.innerHTML=`<div class="map">
    <div class="maphead">
      <button class="tbtn" data-act="home" aria-label="الغلاف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>الغلاف</button>
      <h1>رحلة الأحاديث</h1>
      <span class="chip star">${STAR}<b>${AR(stars())}</b></span>
      <button class="tbtn gear" data-act="settings" aria-label="الإعدادات">${GEAR()}</button>
    </div>
    <div class="trail" style="height:${H}px">
      <svg class="road" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="var(--paper)" stroke-width="26" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <path d="${d}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
      ${nodes}
      <div class="goal" style="left:${end.x}%;top:${end.y}px"><span class="cup">${CUP}</span><span>نهاية الرحلة</span></div>
    </div>
  </div>`;
}

let toastT=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
function show(view,dir){S.view=view;render(dir||1);window.scrollTo({top:0,behavior:"instant"})}

function render(dir){
  document.body.classList.toggle("chromeless",S.view!=="level");
  if(S.view==="home"){renderHome();strip(main);save();return}
  if(S.view==="map"){renderMap();strip(main);save();return}
  if(dirty){const a=S.at;paginate();S.page=findAnchor(a)}
  S.page=Math.max(0,Math.min(PAGES.length-1,S.page));
  const p=PAGES[S.page],pi=S.page;let h="";
  if(p.type==="cover"){
    h=`<div class="cover">
      <p class="kicker">المستوى ١ · الحديث الأول</p>
      <h1>جِهادُ النَّفْسِ</h1>
      <p class="sub">قصّة أحمد والامتحان الكبير</p>
      <div class="fan"><img src="${IMG[3]}" width="${DIM[3][0]}" height="${DIM[3][1]}" alt=""><img src="${IMG[5]}" width="${DIM[5][0]}" height="${DIM[5][1]}" alt=""><img src="${IMG[2]}" width="${DIM[2][0]}" height="${DIM[2][1]}" alt=""></div>
      <div class="sheet rules">
        <div class="rule"><span class="ic" style="background:var(--plum-soft);color:var(--plum)">${BOOK}</span><span>اقرأ القصة كاملة، ثم أجب عن أسئلة التحدّي في آخرها.</span></div>
        <div class="rule"><span class="ic" style="background:var(--amber-soft);color:var(--amber)">${STAR}</span><span>الجواب الصحيح من أول مرة يمنحك نجمة. في القصة ${AR(TOTAL_Q)} نجوم.</span></div>
        <div class="rule"><span class="ic" style="background:var(--sky-soft);color:var(--sky)">${GEM}</span><span>المس الكلمات المنقّطة لتعرف معناها وتجمع كنوز الكلمات (${AR(TOTAL_W)}).</span></div>
      </div>
      <button class="big" id="start">${stars()||gems()?"أكمل القراءة":"ابدأ القراءة"}</button>
    </div>`;
  }else if(p.type==="story"){
    h=storyHTML(p,`الصفحة ${AR(pi)} من ${AR(STORY_N)}`);
  }else if(p.type==="challenge"){
    const left=QS.filter(x=>!S.ans[x.key]).length;
    h=`<div class="cover">
      <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="var(--plum-soft)" stroke="var(--plum)" stroke-width="4"/>
        <path transform="translate(28 30) scale(2.67)" fill="none" stroke="var(--plum)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5zM12 6v14"/>
      </svg>
      <p class="kicker">انتهت القصة</p>
      <h1 style="font-size:clamp(2.2rem,10vw,3.2rem)">وَقْتُ التَّحَدّي</h1>
      <div class="sheet rules">
        <div class="rule"><span class="ic" style="background:var(--plum-soft);color:var(--plum)">${BOOK}</span><span>${AR(TOTAL_Q)} أسئلة عن قصة أحمد، سؤال في كل شاشة.</span></div>
        <div class="rule"><span class="ic" style="background:var(--amber-soft);color:var(--amber)">${STAR}</span><span>الجواب الصحيح من أول مرة يمنحك نجمة.</span></div>
        <div class="rule"><span class="ic" style="background:var(--sky-soft);color:var(--sky)">${GEM}</span><span>إذا أخطأت، نخبرك في أيّ صفحة تجد الجواب.</span></div>
      </div>
      <button class="big" id="startQ">${left===TOTAL_Q?"ابدأ التحدّي":left?"أكمل التحدّي":"راجع الأسئلة"}</button>
    </div>`;
  }else if(p.type==="q"){
    h=`<div class="eyebrow"><span>تحدّي القصة</span><span>السؤال ${AR(p.n)} من ${AR(TOTAL_Q)}</span></div>
      <figure class="pic thumb"><img src="${IMG[p.img]}" width="${DIM[p.img][0]}" height="${DIM[p.img][1]}" style="${picStyle(p.img,.18)}" alt=""></figure>${questionHTML(p)}`;
  }else{
    const st=stars(),g=gems(),pct=(st/TOTAL_Q+g/TOTAL_W)/2;
    const title=pct>=.9?"بطلُ جهادِ النَّفس":pct>=.6?"قارئٌ مُجتهِد":"بداية موفّقة";
    const msg=pct>=.9?"قرأت القصة كلها بانتباه، وفهمت أن الجهاد الأكبر هو جهاد النفس.":pct>=.6?"عمل جميل! ارجع إلى الصفحات لتجمع ما فاتك من نجوم وكلمات.":"ارجع إلى الصفحات، والمس الكلمات المنقّطة، وأجب عن التحدّيات لتجمع المزيد.";
    const list=Object.entries(WORDS).map(([id,o])=>S.words[id]?`<button class="wchip" data-w="${id}">${o.w}</button>`:`<span class="wchip miss" aria-label="كلمة لم تُكتشف بعد">؟</span>`).join("");
    h=`<div class="cover">
      <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="54" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="4"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="3 5"/>
        <path transform="translate(30 28) scale(2.5)" fill="var(--amber)" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>
      </svg>
      <p class="kicker">أتممتَ القصة</p>
      <h1 style="font-size:clamp(2rem,9vw,3rem)">${title}</h1>
      <p class="sub" style="font-family:var(--f-ui);font-size:.95rem;line-height:1.7;margin:0">${msg}</p>
      <div class="result"><span class="chip star">${STAR}${AR(st)} من ${AR(TOTAL_Q)}</span><span class="chip gem">${GEM}${AR(g)} من ${AR(TOTAL_W)}</span></div>
      <section class="sheet" style="width:100%;display:grid;gap:10px;padding-block:12px"><h3 style="margin:0;font-family:var(--f-display);color:var(--sky);font-size:1.2rem">كنوز الكلمات</h3><div class="wchips">${list}</div></section>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="big" data-act="map">العودة إلى الخريطة</button><button class="ghost" id="reset">اقرأ من جديد</button></div>
    </div>`;
  }
  main.innerHTML=`<article class="page${dir<0?" back":""}">${h}</article>`;
  strip(main);
  if(p.type!=="story"&&overflows())main.firstElementChild.classList.add("tight");
  S.at=anchorOf(p);
  $("prev").disabled=false;
  $("next").disabled=S.page===PAGES.length-1;
  $("next").style.visibility=p.type==="cover"?"hidden":"";
  $("pnum").textContent=p.type==="story"?`${AR(S.page)} / ${AR(STORY_N)}`:p.type==="q"?`سؤال ${AR(p.n)} / ${AR(TOTAL_Q)}`:"";
  renderTrack();renderScore();save();
}

function go(d){
  const n=Math.min(PAGES.length-1,Math.max(0,S.page+d));
  if(n===S.page)return;S.page=n;render(d);window.scrollTo({top:0,behavior:"instant"});
}

function burst(el,color){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=[color,"var(--amber)","var(--plum)","var(--good)"];
  for(let i=0;i<14;i++){
    const l=document.createElement("span");l.className="leaf";
    l.style.left=cx+"px";l.style.top=cy+"px";l.style.background=cols[i%4];
    const a=Math.random()*Math.PI*2,d=60+Math.random()*90;
    l.style.setProperty("--dx",Math.cos(a)*d+"px");l.style.setProperty("--dy",Math.sin(a)*d+40+"px");l.style.setProperty("--r",(Math.random()*540-270)+"deg");
    document.body.appendChild(l);setTimeout(()=>l.remove(),1200);
  }
}

let lastFocus=null;
function openWord(id,btn){
  const o=WORDS[id];if(!o)return;
  const isNew=!S.words[id];
  if(isNew){S.words[id]=1;save();document.querySelectorAll(`[data-w="${id}"]`).forEach(b=>b.classList.add("got"));renderScore("gems");burst(btn,"var(--sky)")}
  $("wNew").textContent=isNew?`كنز جديد! جمعت ${AR(gems())} من ${AR(TOTAL_W)}`:"كنز الكلمات";
  $("wTitle").textContent=o.w;$("wText").textContent=o.m;
  strip($("veil"));
  lastFocus=btn;$("veil").hidden=false;$("wClose").focus();
}
function closeWord(){$("veil").hidden=true;lastFocus&&lastFocus.focus()}

main.addEventListener("click",e=>{
  const act=e.target.closest("[data-act]");
  if(act){const a=act.dataset.act;if(a==="map")show("map");else if(a==="home")show("home",-1);else if(a==="settings")openSettings();return}
  const lv=e.target.closest(".node");
  if(lv){const l=LEVELS[+lv.dataset.level-1];if(l.ready)show("level");else toast(`المستوى ${AR(l.n)} قريباً إن شاء الله`);return}
  const w=e.target.closest(".w");if(w){openWord(w.dataset.w,w);return}
  const o=e.target.closest(".opt");
  if(o&&!o.disabled){
    const k=o.dataset.k,oi=+o.dataset.o,[si,qi]=k.split("-").map(Number),q=RAW[si].quiz[qi];
    const tried=S.tries[k]||(S.tries[k]=[]);
    if(oi===q.a){S.ans[k]=tried.length?"later":"first";if(!tried.length){burst(o,"var(--amber)")}render(0);if(S.ans[k]==="first")renderScore("stars");
      const again=main.querySelector(`.opt[data-k="${k}"][data-o="${oi}"]`);again&&again.focus()}
    else if(!tried.includes(oi)){tried.push(oi);render(0);const again=main.querySelector(`.opt[data-k="${k}"][data-o="${oi}"]`);again&&again.focus()}
    return;
  }
  if(e.target.closest("#start")||e.target.closest("#startQ"))go(1);
  if(e.target.closest("#reset")){S={view:"level",page:0,at:null,ans:{},tries:{},words:{},tash:S.tash,fs:S.fs,theme:S.theme,font:S.font,prefsV:2};render(-1)}
});
// keep the entry animation from replaying when the same page re-renders after an answer
const _render=render;render=function(dir){_render(dir);if(dir===0){const a=main.firstElementChild;a&&(a.style.animation="none")}};

$("prev").onclick=()=>{if(S.page===0)show("map",-1);else go(-1)};
$("mapBtn").onclick=()=>show("map",-1);
$("next").onclick=()=>go(1);
$("wClose").onclick=closeWord;
$("veil").addEventListener("click",e=>{if(e.target===$("veil"))closeWord()});
document.addEventListener("keydown",e=>{
  if(!$("veil").hidden){if(e.key==="Escape")closeWord();return}
  if(!$("setVeil").hidden){if(e.key==="Escape")closeSettings();return}
  if(e.target.closest&&e.target.closest("button")&&(e.key===" "||e.key==="Enter"))return;
  if(S.view!=="level")return;
  if(e.key==="ArrowLeft")go(1);if(e.key==="ArrowRight")go(-1);
});
// swipe: in an Arabic book the next page comes from the left
let sx=null,sy=null;
main.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
main.addEventListener("touchend",e=>{if(sx===null||S.view!=="level"){sx=null;return}const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)go(dx>0?1:-1)},{passive:true});

const SIZES=["1rem","1.18rem","1.36rem","1.56rem","1.8rem"];
const R=document.documentElement;
function isDark(){
  if(S.theme)return S.theme==="dark";
  if(R.dataset.theme)return R.dataset.theme==="dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function press(id,on){$(id).setAttribute("aria-pressed",String(on))}
function applyPrefs(){
  S.fs=Math.max(0,Math.min(SIZES.length-1,S.fs|0));
  R.style.setProperty("--fs",SIZES[S.fs]);
  if(S.theme)R.dataset.theme=S.theme;
  R.classList.toggle("arial",S.font==="arial");
  $("fsLvl").textContent=`${AR(S.fs+1)} / ${AR(SIZES.length)}`;
  $("fsDown").disabled=S.fs===0;$("fsUp").disabled=S.fs===SIZES.length-1;
  const d=isDark();press("mDay",!d);press("mNight",d);
  press("fNaskh",S.font!=="arial");press("fArial",S.font==="arial");
  press("tOn",S.tash);press("tOff",!S.tash);
}
function setPref(fn){fn();applyPrefs();dirty=true;if(S.view==="level")render(0);else save()}
$("fsDown").onclick=()=>setPref(()=>S.fs--);
$("fsUp").onclick=()=>setPref(()=>S.fs++);
$("mDay").onclick=()=>setPref(()=>S.theme="light");
$("mNight").onclick=()=>setPref(()=>S.theme="dark");
$("fNaskh").onclick=()=>setPref(()=>S.font="naskh");
$("fArial").onclick=()=>setPref(()=>S.font="arial");
$("tOn").onclick=()=>setPref(()=>S.tash=true);
$("tOff").onclick=()=>setPref(()=>S.tash=false);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyPrefs);
const SAMPLE=$("sample").textContent;
function openSettings(){$("sample").textContent=S.tash?SAMPLE:SAMPLE.replace(/[ً-ْٰ]/g,"");applyPrefs();$("setVeil").hidden=false;$("setClose").focus()}
function closeSettings(){$("setVeil").hidden=true;$("gear").focus()}
$("gear").onclick=openSettings;
$("setClose").onclick=closeSettings;
$("setVeil").addEventListener("click",e=>{if(e.target===$("setVeil"))closeSettings()});
["tOn","tOff"].forEach(id=>$(id).addEventListener("click",()=>{$("sample").textContent=S.tash?SAMPLE:SAMPLE.replace(/[ً-ْٰ]/g,"")}));

document.documentElement.lang="ar";document.documentElement.dir="rtl";
window.claude?.hot?.snapshot?.(()=>S);
let vw=innerWidth,vh=innerHeight,rT=null;
addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{
  if(innerWidth===vw&&Math.abs(innerHeight-vh)<60)return;   // ignore the phone's address bar sliding
  vw=innerWidth;vh=innerHeight;dirty=true;if(S.view==="level")render(0)},150)});
document.fonts&&document.fonts.ready.then(()=>{dirty=true;if(S.view==="level")render(0)});
function start(data){if(data&&typeof data.page==="number")S=Object.assign(S,data);else load();applyPrefs();render(1)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>

</body>
</html>
